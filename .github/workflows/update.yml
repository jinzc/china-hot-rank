name: Update hot rank data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23,0-15 * * *'  # UTC 对应北京时间 7:00-23:00 每小时

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装系统依赖 (canvas 必要库)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++

      # 3️⃣ 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4️⃣ 安装 Node 依赖
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 5️⃣ 执行更新脚本
      - name: Update hot rank data
        run: npm run update

      # 6️⃣ 提交更新数据
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data public/share.png
          git commit -m "chore: update hot rank data" || echo "No changes to commit"
          git push

      # 7️⃣ 设置 Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 8️⃣ 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 9️⃣ 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
