name: Update Hot Rank Data

on:
  schedule:
    - cron: '0 * * * *' # 每小时
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 运行更新脚本
      - name: Run update script
        run: node china-hot-rank/scripts/update.js

      # 5. 构建页面 artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: public

      # 6. 部署到 GitHub Pages
      - name: Deploy
        uses: actions/deploy-pages@v1
