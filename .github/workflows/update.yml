name: Update hot rank data and deploy

on:
  schedule:
    - cron: '0 */1 * * *' # 每小时更新
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v3

      # 2. 设置 Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. 安装依赖
      - run: npm install --legacy-peer-deps

      # 4. 更新排行榜数据
      - run: npm run update

      # 5. 提交更新
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Update hot rank data" || echo "No changes"
          git push

      # 6. 上传 Pages Artifact
      - uses: actions/upload-pages-artifact@v2
        with:
          path: public

      # 7. 部署到 GitHub Pages
      - uses: actions/deploy-pages@v1
