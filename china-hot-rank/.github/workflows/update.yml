name: Update hot rank data and deploy

on:
  schedule:
    # UTC 时间：23点-15点每小时，对应北京时间7点-23点
    - cron: '0 23-15 * * *'
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run hot rank update
        run: node scripts/update.js
      - name: Deploy to GitHub Pages
        run: npm run deploy
